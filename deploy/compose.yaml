name: simpread-tgbot
services:
  reader:
    image: simpread-tgbot:${READER_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "simpread"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: [../.env]
    environment:
      READER_DATA_PATH: /data/reader
      READER_DATABASE_PATH: /data/reader/reader.sqlite3
      NOTION_DATABASE_PATH: /data/notion/notion.sqlite3
      READER_HOST: 0.0.0.0
      READER_PORT: "8090"
    volumes:
      - type: bind
        source: ../data
        target: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${READER_HTTP_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-m", "simpread.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
