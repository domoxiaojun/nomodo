name: simpread-tgbot
services:
  worker:
    image: simpread-worker:f4b704b
    build:
      context: https://github.com/domoxiaojun/parse_hub_bot.git#f4b704b2f539d453ab64d9326cd26991eb2f18f0
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "ext.worker"]
    env_file: [../worker.env]
    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_ALLOW_CONTAINER_BIND: "true"
      WORKER_PORT: "8080"
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    volumes:
      - ../data/worker/data:/app/data
      - ../data/worker/downloads:/app/downloads
      - ../data/worker/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-m", "ext.worker.healthcheck"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 3
  reader:
    depends_on:
      worker:
        condition: service_healthy
    image: simpread-tgbot:${READER_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "simpread"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: [../.env]
    environment:
      READER_DATA_PATH: /data/reader
      READER_DATABASE_PATH: /data/reader/reader.sqlite3
      NOTION_DATABASE_PATH: /data/notion/notion.sqlite3
      READER_HOST: 0.0.0.0
      READER_PORT: "8090"
    volumes:
      - type: bind
        source: ../data
        target: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${READER_HTTP_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-m", "simpread.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
