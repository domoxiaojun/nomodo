[project]
name = "simpread-tgbot"
version = "0.1.0"
description = "Independent Telegram reading bot backed by a ParseHub Worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=46",
    "httpx[socks]>=0.28.1",
    "kurigram>=2.2.26",
    "lxml>=6",
    "markdown-it-py>=3,<5",
    "openai>=2,<3",
    "parsehub>=2.2.4,<2.3",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.0.1",
    "tgcrypto>=1.2.5",
    "tiktoken>=0.12,<1",
]
[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pyyaml>=6",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260906",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/simpread"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008", "C901"]
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
